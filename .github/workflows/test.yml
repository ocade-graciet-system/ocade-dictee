name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
  pull_request:
    paths:
      - "src-tauri/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature). Mirrors the apt
          # set transcribe.cpp's native-ci uses to build -DTRANSCRIBE_VULKAN=ON.
          # ffmpeg exerce le repli de décodage (audio_toolkit::ffmpeg) : sans
          # lui, ses tests s'auto-ignorent (vert silencieux).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev ffmpeg \
            libvulkan-dev glslc spirv-headers

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2

      # tauri-build (build.rs) vérifie la présence du sidecar déclaré dans
      # bundle.externalBin dès la compilation — y compris pour `cargo test`.
      - name: Fetch yt-dlp sidecar
        run: bun scripts/fetch-yt-dlp.ts

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
